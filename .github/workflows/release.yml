# Builds openMapper for macOS, Windows and Linux with the tools/package-* scripts. A tag
# v<version> publishes them as that release on GitHub; run by hand, the packages are only
# kept with the run.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            run: sh tools/package-macos.sh
          - os: windows-latest
            run: pwsh -File tools/package-windows.ps1
          - os: ubuntu-latest
            run: sh tools/package-linux.sh
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libwayland-dev
      - run: cargo test --release --locked
      - run: ${{ matrix.run }}
      - uses: actions/upload-artifact@v4
        with:
          name: openMapper-${{ runner.os }}
          path: |
            target/package/*.zip
            target/package/*.tar.gz

  release:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: packages/*
          generate_release_notes: true
