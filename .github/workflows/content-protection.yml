name: Content protection

on:
  push:
    branches: [feat/content-protection]
    paths-ignore: ["tools/fingerprint.py", "tools/test_fingerprint.py", "docs/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: content-protection-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 4
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: content-protection-${{ matrix.os }}
      - run: cargo test --release --locked
      - run: cargo build --release --locked
      - run: python3 tools/i18n/check.py
